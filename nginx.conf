server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ===== Markdown 内容目录 =====
    # 前端运行时通过 HTTP 拉取 md 文件和目录列表。
    # 修改 alias 后面的路径为你服务器上 md 目录的绝对路径。
    # autoindex json 让前端能递归获取目录树。
    location /posts/ {
        alias /opt/aldus-blog/awesome-me/;
        autoindex on;
        autoindex_format json;
        # 覆盖 server 级继承的 `index index.html`：
        # 若笔记目录内存在 index.html（如代码示例的 static/index.html），
        # nginx 会优先返回该 HTML 文件而不是 autoindex JSON，导致前端目录树解析失败。
        # 指向一个不存在的文件名，让目录请求始终走 autoindex JSON。
        index _autoindex_none_;
        charset utf-8;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";

        # 允许 CORS（前端和 md 内容可能不在同源）
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ===== SPA History Fallback =====
    # 所有未匹配的请求都返回 index.html，由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 静态资源缓存 =====
    # Vite 构建产物带 hash，可长期缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 图片缓存
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ===== 安全头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ===== 压缩 =====
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
